<!DOCTYPE html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Astera Coach · makieta slajdów</title>
<style>
:root{
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bgfilter:brightness(.42) saturate(.82) contrast(.96) blur(.5px);
  --veil:linear-gradient(180deg,rgba(26,20,14,.30),rgba(20,15,11,.42));
  --shelf:linear-gradient(to bottom,transparent,rgba(28,21,15,.62));
  --bg:#2A2219; --bg2:#342A20; --panel:rgba(58,48,40,.55); --panel2:rgba(40,33,27,.72);
  --ink:#F6EFE2; --dim:#D3C4A8; --mut:#9C8B70;
  --gold:#E0BC77; --goldsoft:rgba(224,188,119,.14);
  --line:rgba(224,188,119,.34); --line2:rgba(224,188,119,.18);
  --glow:0 0 50px rgba(224,188,119,.16);
  --leaf:rgba(224,188,119,.085); --leaf2:rgba(224,188,119,.042);
  --med:rgba(30,24,19,.62); --medink:#F6EFE2; --medline:rgba(224,188,119,.62);
  --plate:rgba(18,14,11,.52);      /* mleczna płytka pod podpisem */
  --plateink:#F6EFE2;
}
[data-theme="light"]{
  --bgfilter:brightness(1.55) saturate(.62) contrast(.92) blur(.5px);
  --veil:linear-gradient(180deg,rgba(246,240,229,.80),rgba(238,229,213,.86));
  --shelf:linear-gradient(to bottom,transparent,rgba(248,243,233,.66));
  --bg:#F0E9DC; --bg2:#E7DECC; --panel:rgba(255,252,246,.80); --panel2:rgba(252,248,240,.78);
  --ink:#24190F; --dim:#5C4A34; --mut:#8A7355;
  --gold:#8C6A22; --goldsoft:rgba(140,106,34,.11);
  --line:rgba(140,106,34,.40); --line2:rgba(140,106,34,.20);
  --glow:0 0 50px rgba(140,106,34,.13);
  --leaf:rgba(140,106,34,.090); --leaf2:rgba(140,106,34,.045);
  --med:rgba(255,252,246,.88); --medink:#24190F; --medline:rgba(140,106,34,.70);
  --plate:rgba(20,14,9,.46);
  --plateink:#FBF5EA;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  overflow-x:hidden;display:flex;flex-direction:column;min-height:100vh;transition:background .5s,color .5s;
  background:
    radial-gradient(1100px 720px at 18% 0%,rgba(224,188,119,.10),transparent 62%),
    radial-gradient(900px 700px at 88% 24%,rgba(196,117,107,.09),transparent 62%),
    var(--bg);
  background-attachment:fixed}
[data-theme="light"] body,body[data-x]{}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.ic{width:20px;height:20px;stroke:currentColor;stroke-width:1.25;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:16px;height:16px} .ic.l{width:26px;height:26px}

@keyframes bgDrift{0%,100%{transform:scale(1.30) translate3d(0,0,0)}33%{transform:scale(1.34) translate3d(-1.4%,-1%,0)}66%{transform:scale(1.32) translate3d(1.2%,.8%,0)}}
.mist{position:fixed;left:-40%;right:-40%;height:46%;z-index:0;pointer-events:none;mix-blend-mode:screen;opacity:.10;filter:blur(22px);background:radial-gradient(58% 92% at 31% 58%,rgba(216,190,148,.9),transparent 70%),radial-gradient(48% 78% at 73% 42%,rgba(198,168,122,.7),transparent 72%)}
.mist.m1{top:26%;animation:mistDrift 80s ease-in-out infinite}
.mist.m2{top:56%;animation:mistDrift 96s ease-in-out infinite reverse}
@keyframes mistDrift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(4%,-2%,0)}}
[data-theme="light"] .mist{mix-blend-mode:multiply;opacity:.05}
.shelf{position:fixed;left:0;right:0;bottom:0;height:230px;z-index:1;pointer-events:none;backdrop-filter:blur(26px) saturate(1.25);-webkit-backdrop-filter:blur(26px) saturate(1.25);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.28) 26%,rgba(0,0,0,.72) 52%,#000 78%);mask-image:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.28) 26%,rgba(0,0,0,.72) 52%,#000 78%);background:var(--shelf)}
.shelf::after{content:"";position:absolute;left:8%;right:8%;bottom:206px;height:1px;background:linear-gradient(90deg,transparent,var(--line2) 22%,var(--line) 50%,var(--line2) 78%,transparent)}
.veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:var(--veil)}
.vign{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(125% 95% at 50% 44%,transparent 34%,rgba(0,0,0,.26) 100%)}
[data-theme="light"] .vign{background:radial-gradient(125% 95% at 50% 44%,transparent 38%,rgba(90,66,30,.16) 100%)}
.leafbg{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.leafbg svg{position:absolute;stroke:var(--leaf);fill:none;stroke-width:1.1;stroke-linejoin:round}
.leafbg .l1{width:820px;height:820px;left:-360px;top:-8%}
.leafbg .l2{width:960px;height:960px;right:-430px;top:10%;transform:scaleX(-1)}
.leafbg .l3{width:520px;height:520px;left:-90px;bottom:-300px;stroke:var(--leaf2)}
.leafbg .l4{width:460px;height:460px;right:-60px;bottom:-280px;stroke:var(--leaf2);transform:scaleX(-1)}

header{position:relative;z-index:5;display:flex;align-items:center;gap:26px;padding:16px 30px;
  border-bottom:1px solid var(--line2);background:var(--panel2);
  backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);
  box-shadow:inset 0 -1px 0 rgba(255,255,255,.05)}
.brand{display:flex;align-items:center;gap:12px;min-width:230px}
.brand .mark{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold)}
.brand b{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:4px;display:block;color:var(--gold)}
.brand .bs{font-size:9.5px;letter-spacing:2.6px;color:var(--mut);text-transform:uppercase;display:block;margin-top:2px}
nav{display:flex;gap:4px;flex:1;justify-content:center}
nav button{display:grid;justify-items:center;gap:5px;padding:8px 16px 9px;border-radius:12px;color:var(--mut);position:relative}
nav button span{font-size:11px;letter-spacing:.4px;font-weight:500}
nav button.on{color:var(--gold)}
nav button.on::after{content:"";position:absolute;left:18px;right:18px;bottom:-10px;height:2px;background:var(--gold);border-radius:2px}
.tools{display:flex;align-items:center;gap:10px;min-width:230px;justify-content:flex-end}
.pillset{display:flex;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.pillset button{padding:7px 14px;font-size:11px;letter-spacing:1.4px;color:var(--mut);text-transform:uppercase}
.pillset button.on{background:var(--gold);color:var(--bg)}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
.iconbtn.on{background:var(--goldsoft);color:var(--gold);border-color:var(--gold)}

main{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;padding:26px 20px 0}
.title{text-align:center}
.title .kick{font-size:10px;letter-spacing:3.4px;color:var(--mut);text-transform:uppercase}
.title h1{font-family:var(--serif);font-size:clamp(24px,3.1vw,35px);font-weight:500;letter-spacing:8.5px;margin-top:8px;text-transform:uppercase}
.title .sub{font-size:10px;letter-spacing:3.2px;color:var(--mut);margin-top:8px;text-transform:uppercase}

.viewsw{display:flex;border:1px solid var(--line);border-radius:26px;overflow:hidden;margin:16px 0 2px;background:var(--panel2)}
.viewsw button{padding:9px 20px;font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:var(--mut);border-right:1px solid var(--line2)}
.viewsw button:last-child{border-right:0}
.viewsw button.on{background:var(--goldsoft);color:var(--gold)}

/* ═══ WIDOK A — ORBITA SLAJDÓW ═══ */
.orbit{position:relative;width:min(680px,90vw);aspect-ratio:1;margin:30px auto 0}
.ring{position:absolute;border-radius:50%;border:1px solid transparent;
  background:conic-gradient(from -100deg,var(--line),var(--line2) 40%,transparent 62%,var(--line2) 84%,var(--line)) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.r1{inset:2%} .r2{inset:26%}
.slide{
  position:absolute;width:19%;aspect-ratio:3/4;border-radius:60px 60px 16px 16px;
  transform-origin:50% 50%;overflow:hidden;cursor:pointer;
  border:1px solid rgba(185,154,93,.55);background:var(--bg2);
  box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.07),
             inset 0 0 0 4px var(--bg2),inset 0 0 0 5px var(--line2);
  transition:.3s
}
.slide img{width:100%;height:100%;object-fit:cover;filter:contrast(1.06) saturate(1.06)}
.slide .sh{display:none}
.slide .cap{position:absolute;left:7px;right:7px;bottom:7px;text-align:center;color:var(--plateink);
  background:var(--plate);backdrop-filter:blur(14px) saturate(1.2);border:1px solid rgba(255,255,255,.14);
  border-radius:12px;padding:8px 6px 9px}
.slide .cap .n{font-size:8px;letter-spacing:2.4px;opacity:.82}
.slide .cap b{display:block;font-family:var(--serif);font-size:12px;font-weight:500;letter-spacing:1.1px;margin-top:3px;line-height:1.25}
.slide:hover{border-color:var(--gold)}
.slide.now{border-color:var(--gold);transform:translate(-50%,-50%) scale(1.1)!important;z-index:7;
  box-shadow:0 0 0 1px var(--gold),0 26px 56px rgba(0,0,0,.45),var(--glow)}
.slide.dim{opacity:.74}
.slide.dim:hover{opacity:1}

.medal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:31%;aspect-ratio:.78;border-radius:50%/50%;
  background:var(--med);backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid var(--medline);color:var(--medink);
  display:grid;place-items:center;text-align:center;padding:7%;cursor:pointer;
  box-shadow:var(--glow),0 20px 50px rgba(0,0,0,.4),inset 0 0 0 6px transparent,inset 0 0 0 7px var(--line2);z-index:6
}
.medal .mn{font-size:10px;letter-spacing:3.4px;color:var(--gold)}
.medal h2{font-family:var(--serif);font-size:clamp(17px,2vw,23px);font-weight:500;letter-spacing:3.4px;margin:10px 0 8px;text-transform:uppercase;line-height:1.2}
.medal .orn{width:44px;height:11px;stroke:var(--gold);fill:none;stroke-width:1;margin:0 auto}
.medal .ms{font-size:10px;letter-spacing:1.4px;color:var(--dim);margin-top:8px;line-height:1.6}
.medal .mgo{font-size:9.5px;letter-spacing:2.6px;color:var(--gold);margin-top:11px;text-transform:uppercase}
.tick{position:absolute;transform:translate(-50%,-50%);font-size:9px;letter-spacing:1.8px;color:var(--mut);
  border:1px solid var(--line2);border-radius:20px;padding:4px 10px;background:var(--bg2);z-index:5}

/* ═══ WIDOK B — KARUZELA ═══ */
.carou{position:relative;width:min(1080px,96vw);margin:10px auto 0;display:flex;align-items:center;justify-content:center;gap:22px}
.arrow{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);flex:none}
.arrow:hover{background:var(--goldsoft)}
.stagec{position:relative;display:flex;align-items:center;justify-content:center;gap:18px;flex:1}
.big{position:relative;width:min(400px,44vw);aspect-ratio:3/4.1;border-radius:120px 120px 26px 26px;overflow:hidden;
  border:1px solid rgba(185,154,93,.55);
  box-shadow:0 30px 70px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.08),
             inset 0 0 0 6px var(--bg2),inset 0 0 0 7px var(--line2)}
.big img{width:100%;height:100%;object-fit:cover}
.big .sh{display:none}
.big .bt{position:absolute;left:0;right:0;bottom:24px;text-align:center;color:#F5EBDA;
  font-family:var(--serif);font-size:24px;letter-spacing:2px}
.side{width:min(150px,16vw);aspect-ratio:3/4.4;border-radius:70px 70px 18px 18px;overflow:hidden;
  border:1px solid var(--line2);opacity:.82;position:relative;cursor:pointer;transition:.3s}
.side:hover{opacity:.9;border-color:var(--gold)}
.side img{width:100%;height:100%;object-fit:cover;filter:contrast(1.04)}
.side .sc{position:absolute;left:6px;right:6px;bottom:6px;text-align:center;color:var(--plateink);font-size:8.5px;letter-spacing:1.6px;text-transform:uppercase;
  background:var(--plate);backdrop-filter:blur(12px);border-radius:10px;padding:7px 4px}
.bigmed{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56%;aspect-ratio:.80;border-radius:50%;
  background:var(--med);backdrop-filter:blur(20px) saturate(1.25);border:1px solid var(--medline);color:var(--medink);
  box-shadow:0 18px 46px rgba(0,0,0,.35);
  display:grid;place-items:center;text-align:center;padding:9%;z-index:4}
.thumbs{position:absolute;right:0;top:-8px;display:flex;gap:8px}
.thumbs div{width:62px;height:78px;border-radius:26px 26px 8px 8px;overflow:hidden;border:1px solid var(--line2)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.dots{display:flex;gap:7px;justify-content:center;margin-top:18px}
.dots i{width:26px;height:2px;background:var(--line);border-radius:2px}
.dots i.on{background:var(--gold)}

.stats{position:relative;z-index:3;width:min(1180px,94vw);margin:26px auto 0;display:grid;grid-template-columns:repeat(5,1fr);
  border:1px solid var(--line);border-radius:20px;background:var(--panel2);
  backdrop-filter:blur(30px) saturate(1.35);-webkit-backdrop-filter:blur(30px) saturate(1.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 18px 46px rgba(0,0,0,.30);overflow:hidden}
.stat{display:flex;align-items:center;gap:14px;padding:17px 22px;border-right:1px solid var(--line2)}
.stat:last-child{border-right:0}
.stat .sic{color:var(--gold);flex:none}
.stat .sl{font-size:9px;letter-spacing:2.2px;color:var(--mut);text-transform:uppercase}
.stat .sv{font-family:var(--serif);font-size:22px;font-weight:500;margin-top:3px;letter-spacing:1px}

.stats::before,.stats::after{content:"";position:absolute;top:50%;width:7px;height:7px;
  border:1px solid var(--line);transform:translateY(-50%) rotate(45deg);background:var(--bg)}
.stats::before{left:-4px} .stats::after{right:-4px}
.viewsw{position:relative}
.viewsw::before,.viewsw::after{content:"";position:absolute;top:50%;width:5px;height:5px;
  border:1px solid var(--line);transform:translateY(-50%) rotate(45deg);background:var(--bg)}
.viewsw::before{left:-14px} .viewsw::after{right:-14px}
footer{position:relative;z-index:3;margin-top:24px;padding:14px 30px;border-top:1px solid var(--line2);
  backdrop-filter:blur(30px) saturate(1.3);-webkit-backdrop-filter:blur(30px) saturate(1.3);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-size:9.5px;letter-spacing:1.9px;color:var(--mut);text-transform:uppercase;background:var(--panel2)}
footer .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#6FA97F;margin-left:8px;vertical-align:middle}
.hidden{display:none!important}
@media(max-width:1000px){
  header{flex-wrap:wrap;gap:14px;padding:14px 18px}
  .brand,.tools{min-width:auto} nav{order:3;width:100%;overflow-x:auto;justify-content:flex-start}
  .stats{grid-template-columns:repeat(2,1fr)} .stat{border-bottom:1px solid var(--line2)}
  .side,.thumbs{display:none} .big{width:70vw}
}
</style>
</head>

const ETAPY4=[
 {n:'Wprowadzenie',t:'09:00',s:'Kim jesteśmy, skąd pochodzi ta praca i jak wygląda dzień.'},
 {n:'Zasady i postawa',t:'10:00',s:'Trzy rodzaje miejsc na ciele. Praca ciężarem, nie siłą rąk.'},
 {n:'Pokaz techniki',t:'11:30',s:'Maliwan prowadzi pełną sekwencję. Rytm jest częścią techniki.'},
 {n:'Praktyka i zakończenie',t:'13:00',s:'Ćwiczenie w parach, korekta dłoni, podsumowanie dnia.'}
];
const ETAPY8=ETAPY4.concat([
 {n:'Masaż głowy',t:'14:00',s:''},{n:'Refleksologia stóp',t:'15:00',s:''},
 {n:'Rozmowa z klientem',t:'16:00',s:''},{n:'Podsumowanie',t:'17:00',s:''}
]);
let E=ETAPY4, act=0, view='a';

const $=id=>document.getElementById(id);
const orbit=$('orbit'), medal=$('medal');

function paintOrbit(){
  orbit.querySelectorAll('.slide,.tick').forEach(x=>x.remove());
  const n=E.length, R=39.5;
  E.forEach((e,i)=>{
    const a=(-90+i*360/n), rad=a*Math.PI/180;
    const x=50+R*Math.cos(rad), y=50+R*Math.sin(rad);
    const d=document.createElement('div');
    d.className='slide'+(i===act?' now':' dim');
    d.style.left=(x)+'%'; d.style.top=(y)+'%';
    d.style.transform='translate(-50%,-50%)';
    d.innerHTML=`<img src="${PH[i%PH.length]}" alt=""><div class="sh"></div>
      <div class="cap"><div class="n">0${i+1} / 0${n}</div><b>${e.n}</b></div>`;
    d.onclick=()=>{act=i;paint();};
    orbit.appendChild(d);
    const ta=(-90+(i+.5)*360/n)*Math.PI/180;
    const t=document.createElement('div'); t.className='tick';
    t.style.left=(50+26*Math.cos(ta))+'%'; t.style.top=(50+26*Math.sin(ta))+'%';
    t.textContent=e.t; orbit.appendChild(t);
  });
  const e=E[act];
  medal.innerHTML=`<div>
    <div class="mn">0${act+1} / 0${E.length}</div>
    <h2>${e.n}</h2>
    <svg class="orn" viewBox="0 0 56 14"><path d="M2 7h18M36 7h18"/><path d="M28 2c-3 2-4 4-4 5 0 1 1 3 4 5 3-2 4-4 4-5 0-1-1-3-4-5z"/></svg>
    <div class="ms">${e.s||'—'}</div>
    <div class="mgo">Otwórz procedurę →</div></div>`;
}

function paintCarou(){
  const n=E.length, L=(act-1+n)%n, R=(act+1)%n, e=E[act];
  $('sL').innerHTML=`<img src="${PH[L%PH.length]}"><div class="sc">${E[L].n}</div>`;
  $('sR').innerHTML=`<img src="${PH[R%PH.length]}"><div class="sc">${E[R].n}</div>`;
  $('sL').onclick=()=>{act=L;paint();}; $('sR').onclick=()=>{act=R;paint();};
  $('sC').innerHTML=`<img src="${PH[act%PH.length]}"><div class="sh"></div>
    <div class="bigmed"><div>
      <div class="mn">0${act+1} / 0${n}</div>
      <h2 style="font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:2px;margin:9px 0 7px;text-transform:uppercase;line-height:1.2">${e.n}</h2>
      <svg class="orn" viewBox="0 0 56 14" style="width:44px;height:11px;stroke:var(--gold);fill:none;stroke-width:1;margin:0 auto"><path d="M2 7h18M36 7h18"/><path d="M28 2c-3 2-4 4-4 5 0 1 1 3 4 5 3-2 4-4 4-5 0-1-1-3-4-5z"/></svg>
      <div class="ms" style="font-size:10px;letter-spacing:1.4px;color:var(--dim);margin-top:8px;line-height:1.6">${e.s||'—'}</div>
      <div class="mgo" style="font-size:9.5px;letter-spacing:2.6px;color:var(--gold);margin-top:10px;text-transform:uppercase">Otwórz →</div>
    </div></div>
    <div class="bt">${e.t}</div>`;
  $('thumbs').innerHTML=E.slice(0,4).map((x,i)=>`<div><img src="${PH[i%PH.length]}"></div>`).join('');
  $('dots').innerHTML=E.map((x,i)=>`<i class="${i===act?'on':''}"></i>`).join('');
}

function paint(){
  $('stEtap').textContent=(act+1)+' / '+E.length;
  if(view==='b'){ paintCarou(); } else { paintOrbit(); }
}
window.step=d=>{act=(act+d+E.length)%E.length;paint();};

document.querySelectorAll('.viewsw button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.viewsw button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); view=b.dataset.v;
  E = view==='c'?ETAPY8:ETAPY4; if(act>=E.length) act=0;
  const isB = view==='b';
  orbit.classList.toggle('hidden',isB);
  $('carou').classList.toggle('hidden',!isB);
  $('dots').classList.toggle('hidden',!isB);
  paint();
});

const R=document.documentElement, I=$('themeIco');
const moon='<path d="M20 14.5A8 8 0 0 1 9.5 4 8.2 8.2 0 1 0 20 14.5z"/>';
const sun='<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"/>';
$('themeBtn').onclick=()=>{const d=R.dataset.theme==='dark';R.dataset.theme=d?'light':'dark';I.innerHTML=d?sun:moon;};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});
paint();
</script>
</body>
</html>
